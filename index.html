<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q11 Call Prioritization Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1><strong>Q11 Call Dashboard</strong></h1>
        <div id="call-count"><strong>Total Calls: </strong><span id="total-calls">0</span></div>
    </header>
    
    <div id="incident-container"></div>

    <table>
        <thead>
            <tr>
                <th>Time</th>
                <th>Address</th>
                <th>Description</th>
                <th>Priority</th>
                <th>Caller Name</th>
                <th>Caller Phone</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="call-data">
        </tbody>
    </table>

    <script src="script.js"></script>
</body>
</html>
